name: Baileys runtime smoke tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - run: npm install --ignore-scripts --legacy-peer-deps
      - name: TypeScript public API check
        run: npm run typecheck
      - name: JavaScript runtime smoke tests
        run: npm run test:smoke
